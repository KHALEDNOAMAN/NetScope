name: checks

on:
  push:
  pull_request:
  schedule:
    - cron: '0 6 * * 1'   # Monday, so a new CVE surfaces within a week

# The default token can write to the repo. Nothing here needs that.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to a commit, so a moved tag cannot change what runs here.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          python-version: '3.12'

      # Every file must at least parse. This repo shipped a syntax error.
      - name: compile
        run: python -m compileall -q .

      # ruff pinned, rules pinned in ruff.toml. An unpinned ruff turned this
      # step red on its own when a release widened the default rule set.
      - name: lint
        run: uvx ruff@0.17.4 check --output-format github .

      - name: workflow audit
        run: uvx zizmor@1.32.0 --offline --min-severity medium .github/workflows/

      # Audit what the resolver actually picks, not what requirements.txt
      # asks for. Pinning fastapi to a patched version still resolved a
      # vulnerable starlette.
      - name: audit dependencies
        run: |
          if [ -f requirements.txt ]; then
            sed -E 's/[=<>!~].*//' requirements.txt | grep -E '^[A-Za-z]' > /tmp/u.txt
            uv pip compile -q --no-header -o /tmp/resolved.txt /tmp/u.txt
            uvx pip-audit -r /tmp/resolved.txt
          fi

      # Local semgrep rules, committed so the scan is reviewable and needs no
      # network. These are the checks that caught the real problems: a
      # hardcoded signing key, Flask debug on a public bind, and exceptions
      # discarded with pass.
      - name: semgrep
        run: uvx semgrep scan --config=.semgrep.yml --error --metrics=off --quiet .

      # requirements.txt states minimum safe versions. This is what actually
      # gets installed, so this is what gets audited.
      - name: lock is current
        run: |
          if [ -f requirements.txt ] && [ -f requirements.lock.txt ]; then
            sed -E 's/[=<>!~].*//' requirements.txt | grep -E '^[A-Za-z]' > /tmp/u.txt
            uv pip compile -q --no-header --python-version 3.11 -o /tmp/fresh.txt /tmp/u.txt
            # compare pins only; the '# via' comments carry machine-specific paths
            if ! diff -q <(grep -E '^[A-Za-z]' requirements.lock.txt) <(grep -E '^[A-Za-z]' /tmp/fresh.txt) >/dev/null; then
              echo "::warning::requirements.lock.txt is behind what the resolver now picks. Regenerate it."
            fi
          fi

      - name: tests
        run: |
          if ls tests/test_*.py >/dev/null 2>&1; then
            uv venv && uv pip install -q -r requirements.txt pytest
            uv run python -m pytest -q
          else
            echo "no tests yet"
          fi
